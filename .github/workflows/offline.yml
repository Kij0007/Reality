name: Reality Offline Android
on:
  push:
    branches: ["codex/reality-offline"]
    paths:
      - "android-offline/**"
      - "!android-offline/**/*.md"
      - "scripts/Export*.ps1"
      - "scripts/reality-export.sql"
      - "scripts/export-localhost.py"
      - ".github/workflows/offline.yml"
  pull_request:
    paths:
      - "android-offline/**"
      - "!android-offline/**/*.md"
      - "scripts/Export*.ps1"
      - "scripts/reality-export.sql"
      - "scripts/export-localhost.py"
      - ".github/workflows/offline.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reality-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android-offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Verify Gradle wrapper integrity
        run: echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check
      - name: Build offline app and UI test APKs, unit tests, and lint
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug
      - name: Verify unsigned release minification
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify the APK does not request internet access
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk > app/build/offline-permissions.txt
          cat app/build/offline-permissions.txt
          if grep -q 'android.permission.INTERNET' app/build/offline-permissions.txt; then
            echo 'The offline APK unexpectedly requests internet access.' >&2
            exit 1
          fi
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Reality-Offline-debug-APK
          path: android-offline/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload verification reports and Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reality-Offline-verification
          path: |
            android-offline/app/build/reports/
            android-offline/app/build/test-results/
            android-offline/app/build/offline-permissions.txt
            android-offline/app/schemas/
      - name: Package independently openable Android project
        if: success()
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          root = pathlib.Path.cwd().parent
          files = subprocess.check_output(['git', '-C', str(root), 'ls-files', '-z', 'android-offline']).decode().split('\0')
          files = [name for name in files if name]
          assert len(files) >= 50, 'Offline Android source package is incomplete'
          with zipfile.ZipFile(root / 'Reality-Offline-project.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in files:
                  archive.write(root / name, pathlib.Path(name).relative_to('android-offline'))
              schema_root = root / 'android-offline/app/schemas'
              for schema in schema_root.rglob('*.json'):
                  if str(schema.relative_to(root)) not in files:
                      archive.write(schema, schema.relative_to(root / 'android-offline'))
          PY
      - name: Upload Android project
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Reality-Offline-project
          path: Reality-Offline-project.zip
      - name: Package pure JVM backup validation and calculations
        if: success()
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, zipfile
          root = pathlib.Path.cwd().parent
          classes = pathlib.Path('app/build/tmp/kotlin-classes/debug')
          output = root / 'offline-migration-runtime'
          output.mkdir()
          prefixes = (
              'com/reality/android/data/remote/dto/',
              'com/reality/android/data/local/RealityCalculations',
              'com/reality/android/data/local/LocalSnapshot',
              'com/reality/android/data/local/LocalDataException',
              'com/reality/android/data/backup/BackupCodec',
              'com/reality/android/data/backup/RealityBackup',
          )
          names = []
          with zipfile.ZipFile(output / 'reality-offline-local-logic.jar', 'w', zipfile.ZIP_DEFLATED) as archive:
              for compiled in classes.rglob('*.class'):
                  name = compiled.relative_to(classes).as_posix()
                  if name.startswith(prefixes):
                      archive.write(compiled, name)
                      names.append(name)
          for required in ('com/reality/android/data/local/RealityCalculations.class', 'com/reality/android/data/backup/BackupCodec.class'):
              assert required in names, f'Missing JVM migration class: {required}'
          cache = pathlib.Path(os.environ.get('GRADLE_USER_HOME', pathlib.Path.home() / '.gradle')) / 'caches/modules-2/files-2.1'
          dependencies = (
              ('org.jetbrains.kotlin', 'kotlin-stdlib', '2.2.21'),
              ('org.jetbrains.kotlinx', 'kotlinx-serialization-core-jvm', '1.9.0'),
              ('org.jetbrains.kotlinx', 'kotlinx-serialization-json-jvm', '1.9.0'),
          )
          for group, module, version in dependencies:
              candidates = list((cache / group / module / version).glob(f'*/{module}-{version}.jar'))
              assert candidates, f'Missing migration runtime dependency: {module}'
              shutil.copyfile(candidates[0], output / candidates[0].name)
          print(f'Packaged {len(names)} pure JVM classes; no Android SDK, database credentials or account tokens included.')
          PY
      - name: Upload local migration verification runtime
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Reality-Offline-migration-runtime
          path: offline-migration-runtime/

  emulator-tests:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Room and Compose tests with network radios disabled
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell cmd connectivity airplane-mode enable
            test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = "1"
            bash android-offline/scripts/verify-emulator.sh
      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reality-Offline-Compose-tests
          path: |
            android-offline/app/build/reports/androidTests/
            android-offline/app/build/outputs/androidTest-results/
